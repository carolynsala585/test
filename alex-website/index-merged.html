<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex sets9ve - Cybersecurity Professional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Light theme variables */
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent: #3b82f6;
            --border: #e2e8f0;
            --shadow: rgba(0, 0, 0, 0.1);
            --quote-bg: #f1f5f9;
            --social-hover: #f8fafc;
        }

        [data-theme="dark"] {
            /* Dark theme variables */
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #60a5fa;
            --border: #334155;
            --shadow: rgba(0, 0, 0, 0.3);
            --quote-bg: #1e293b;
            --social-hover: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                /* Primary security gradient */
                radial-gradient(circle at 25% 25%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 75% 75%, rgba(16, 185, 129, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 50% 10%, rgba(139, 92, 246, 0.05) 0%, transparent 35%),
                /* Secondary security accents */
                radial-gradient(circle at 10% 60%, rgba(239, 68, 68, 0.04) 0%, transparent 30%),
                radial-gradient(circle at 90% 40%, rgba(245, 158, 11, 0.04) 0%, transparent 30%),
                /* Base gradient - adapts to theme */
                linear-gradient(135deg, 
                    rgba(15, 23, 42, 0.02) 0%, 
                    rgba(30, 41, 59, 0.01) 50%, 
                    rgba(15, 23, 42, 0.02) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* Cybersecurity-themed background elements */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                /* Security grid pattern */
                url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='grid' width='80' height='80' patternUnits='userSpaceOnUse'%3E%3Cpath d='M 80 0 L 0 0 0 80' fill='none' stroke='%233b82f6' stroke-width='0.5' opacity='0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='100%25' height='100%25' fill='url(%23grid)'/%3E%3C/svg%3E"),
                /* Binary code pattern */
                url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='binary' width='120' height='120' patternUnits='userSpaceOnUse'%3E%3Ctext x='10' y='15' font-family='monospace' font-size='8' fill='%2310b981' opacity='0.08'%3E1010%3C/text%3E%3Ctext x='10' y='35' font-family='monospace' font-size='8' fill='%2310b981' opacity='0.08'%3E1101%3C/text%3E%3Ctext x='10' y='55' font-family='monospace' font-size='8' fill='%2310b981' opacity='0.08'%3E0110%3C/text%3E%3Ctext x='10' y='75' font-family='monospace' font-size='8' fill='%2310b981' opacity='0.08'%3E1001%3C/text%3E%3Ctext x='10' y='95' font-family='monospace' font-size='8' fill='%2310b981' opacity='0.08'%3E0011%3C/text%3E%3C/pattern%3E%3C/defs%3E%3Crect width='100%25' height='100%25' fill='url(%23binary)'/%3E%3C/svg%3E"),
                /* Circuit board pattern */
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='circuit' width='100' height='100' patternUnits='userSpaceOnUse'%3E%3Cpath d='M 20 20 L 80 20 M 20 80 L 80 80 M 20 20 L 20 80 M 80 20 L 80 80 M 50 20 L 50 80 M 20 50 L 80 50' stroke='%238b5cf6' stroke-width='0.3' opacity='0.06' fill='none'/%3E%3Ccircle cx='20' cy='20' r='1' fill='%238b5cf6' opacity='0.1'/%3E%3Ccircle cx='80' cy='20' r='1' fill='%238b5cf6' opacity='0.1'/%3E%3Ccircle cx='20' cy='80' r='1' fill='%238b5cf6' opacity='0.1'/%3E%3Ccircle cx='80' cy='80' r='1' fill='%238b5cf6' opacity='0.1'/%3E%3Ccircle cx='50' cy='50' r='1' fill='%238b5cf6' opacity='0.1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='100%25' height='100%25' fill='url(%23circuit)'/%3E%3C/svg%3E"),
                /* Matrix-style data streams */
                url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='matrix' width='200' height='200' patternUnits='userSpaceOnUse'%3E%3Ctext x='10' y='20' font-family='monospace' font-size='10' fill='%2310b981' opacity='0.03'%3E01%3C/text%3E%3Ctext x='10' y='40' font-family='monospace' font-size='10' fill='%2310b981' opacity='0.03'%3E10%3C/text%3E%3Ctext x='10' y='60' font-family='monospace' font-size='10' fill='%2310b981' opacity='0.03'%3E11%3C/text%3E%3Ctext x='10' y='80' font-family='monospace' font-size='10' fill='%2310b981' opacity='0.03'%3E00%3C/text%3E%3Ctext x='10' y='100' font-family='monospace' font-size='10' fill='%2310b981' opacity='0.03'%3E01%3C/text%3E%3Ctext x='10' y='120' font-family='monospace' font-size='10' fill='%2310b981' opacity='0.03'%3E10%3C/text%3E%3Ctext x='10' y='140' font-family='monospace' font-size='10' fill='%2310b981' opacity='0.03'%3E11%3C/text%3E%3Ctext x='10' y='160' font-family='monospace' font-size='10' fill='%2310b981' opacity='0.03'%3E00%3C/text%3E%3Ctext x='10' y='180' font-family='monospace' font-size='10' fill='%2310b981' opacity='0.03'%3E01%3C/text%3E%3C/pattern%3E%3C/defs%3E%3Crect width='100%25' height='100%25' fill='url(%23matrix)'/%3E%3C/svg%3E");
            background-position: 0 0, 40px 40px, 60px 60px, 100px 100px;
            z-index: -2;
            pointer-events: none;
            opacity: 0.4;
            animation: matrixFlow 30s linear infinite;
        }

        /* Floating cybersecurity elements */
        .container {
            position: relative;
        }

        /* First floating element */
        .container::before {
            content: '';
            position: fixed;
            top: 15%;
            right: 15%;
            width: 120px;
            height: 120px;
            background: 
                radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%),
                linear-gradient(45deg, rgba(59, 130, 246, 0.05), rgba(16, 185, 129, 0.05));
            border-radius: 50%;
            opacity: 0.6;
            animation: securityPulse 8s ease-in-out infinite;
            z-index: -1;
            filter: blur(1px);
        }

        /* Second floating element */
        .container::after {
            content: '';
            position: fixed;
            bottom: 25%;
            left: 10%;
            width: 100px;
            height: 100px;
            background: 
                radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 70%),
                linear-gradient(-45deg, rgba(139, 92, 246, 0.04), rgba(239, 68, 68, 0.04));
            border-radius: 50%;
            opacity: 0.5;
            animation: securityPulse 10s ease-in-out infinite reverse;
            z-index: -1;
            filter: blur(1px);
        }

        @keyframes securityPulse {
            0%, 100% { 
                transform: translateY(0px) scale(1);
                opacity: 0.4;
            }
            50% { 
                transform: translateY(-15px) scale(1.1);
                opacity: 0.7;
            }
        }

        @keyframes matrixFlow {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 3rem;
        }

        #theme-toggle {
            background: none;
            border: 2px solid var(--border);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        #theme-toggle:hover {
            background-color: var(--bg-secondary);
            border-color: var(--accent);
            transform: scale(1.05);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3rem;
        }

        .hero {
            text-align: center;
        }

        .name {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .title {
            font-size: 1.5rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .quote {
            background-color: var(--quote-bg);
            border-left: 4px solid var(--accent);
            padding: 2rem;
            margin: 2rem 0;
            border-radius: 0 8px 8px 0;
            text-align: left;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .quote p {
            font-size: 1.2rem;
            font-style: italic;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .quote cite {
            color: var(--text-secondary);
            font-size: 1rem;
            font-style: normal;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: nowrap;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 50%;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .social-link:hover {
            background-color: var(--accent);
            border-color: var(--accent);
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 8px 25px var(--shadow);
        }

        .social-link:hover i {
            color: white;
            transform: scale(1.1);
        }

        .social-link i {
            font-size: 1.4rem;
            color: var(--accent);
            transition: all 0.3s ease;
        }

        /* Action buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: nowrap;
            margin-top: 2rem;
        }

        .action-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 50%;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .action-button:hover {
            background-color: var(--accent);
            border-color: var(--accent);
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 8px 25px var(--shadow);
        }

        .action-button:hover i {
            color: white;
            transform: scale(1.1);
        }

        .action-button i {
            font-size: 1.4rem;
            color: var(--accent);
            transition: all 0.3s ease;
        }

        /* Entrance animations */
        .hero, .social-links, .action-buttons {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .name {
                font-size: 2.5rem;
            }
            
            .title {
                font-size: 1.2rem;
            }
            
            .quote {
                padding: 1.5rem;
                margin: 1.5rem 0;
            }
            
            .quote p {
                font-size: 1.1rem;
            }
            
            .social-links {
                flex-direction: row;
                align-items: center;
                gap: 1rem;
            }
            
            .social-link {
                width: 60px;
                height: 60px;
            }
            
            .action-buttons {
                flex-direction: row;
                align-items: center;
                gap: 1rem;
            }
            
            .action-button {
                width: 60px;
                height: 60px;
            }
        }

        @media (max-width: 480px) {
            .name {
                font-size: 2rem;
            }
            
            .title {
                font-size: 1rem;
            }
            
            .quote {
                padding: 1rem;
            }
            
            .quote p {
                font-size: 1rem;
            }
            
            .social-links {
                gap: 0.75rem;
            }
            
            .action-buttons {
                gap: 0.75rem;
            }
            
            .social-link,
            .action-button {
                width: 50px;
                height: 50px;
            }
            
            .social-link i,
            .action-button i {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button id="theme-toggle" aria-label="Toggle theme">
                <i class="fas fa-moon"></i>
            </button>
        </header>
        
        <main>
            <div class="hero">
                <h1 class="name">Alex sets9ve</h1>
                <p class="title">Cybersecurity Professional</p>
                
                <blockquote class="quote">
                    <p>"The only truly secure system is one that is powered off, cast in a block of concrete and sealed in a lead-lined room with armed guards."</p>
                    <cite>— Gene Spafford</cite>
                </blockquote>
            </div>
            
            <div class="social-links">
                <a href="https://twitter.com/sets9ve" target="_blank" rel="noopener noreferrer" class="social-link">
                    <i class="fab fa-twitter"></i>
                </a>
                <a href="https://github.com/sets9ve" target="_blank" rel="noopener noreferrer" class="social-link">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://linkedin.com/in/sets9ve" target="_blank" rel="noopener noreferrer" class="social-link">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="https://blog.sets9ve.com" target="_blank" rel="noopener noreferrer" class="social-link">
                    <i class="fas fa-blog"></i>
                </a>
            </div>
            
            <div class="action-buttons">
                <a href="cv.pdf" target="_blank" rel="noopener noreferrer" class="action-button">
                    <i class="fas fa-file-alt"></i>
                </a>
                <a href="about.html" class="action-button">
                    <i class="fas fa-user"></i>
                </a>
            </div>
        </main>
    </div>
    
    <script>
        // Theme switching functionality
        document.addEventListener('DOMContentLoaded', function() {
            const themeToggle = document.getElementById('theme-toggle');
            const body = document.body;
            
            // Check for saved theme preference or default to light theme
            const savedTheme = localStorage.getItem('theme') || 'light';
            body.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
            
            // Theme toggle event listener
            themeToggle.addEventListener('click', function() {
                const currentTheme = body.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                body.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateThemeIcon(newTheme);
            });
            
            // Update theme icon based on current theme
            function updateThemeIcon(theme) {
                const icon = themeToggle.querySelector('i');
                if (theme === 'dark') {
                    icon.className = 'fas fa-sun';
                } else {
                    icon.className = 'fas fa-moon';
                }
            }
            
            // Add smooth entrance animation
            const hero = document.querySelector('.hero');
            const socialLinks = document.querySelector('.social-links');
            const actionButtons = document.querySelector('.action-buttons');
            
            // Fade in animation
            setTimeout(() => {
                hero.style.opacity = '1';
                hero.style.transform = 'translateY(0)';
            }, 100);
            
            setTimeout(() => {
                socialLinks.style.opacity = '1';
                socialLinks.style.transform = 'translateY(0)';
            }, 300);
            
            setTimeout(() => {
                actionButtons.style.opacity = '1';
                actionButtons.style.transform = 'translateY(0)';
            }, 500);
        });
    </script>
</body>
</html>
